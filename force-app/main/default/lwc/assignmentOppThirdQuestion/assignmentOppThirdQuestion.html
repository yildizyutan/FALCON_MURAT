<template>
    <lightning-card title="Assighnment 1" icon-name="standart:opportunity">
        <div class="slds-var-m-around_medium" >
            
            <lightning-combobox
                name="Stage"
                options={stageOptions}
                value={selectedStage}
                onchange={changeHandler}>
            </lightning-combobox>

        </div>
        

        <template if:true={opportunities}>
            <div style="height: 300px;">
                <lightning-datatable
                        key-field="id"
                        data={opportunities}
                        columns={columns}>
                </lightning-datatable>
            </div>
        </template>


        

    </lightning-card>
</template>
