<template>
    <lightning-card title="CREATE RECORD FUNCTION - CONTACT" icon-name="standard:contact">
        <div class="slds-var-m-around_medium">
            <form class="contactCreateForm">
                              
                <div class="slds-grid slds-gutters">

                    <div class="slds-col">

                        <lightning-input 
                            type="text"
                            label="First Name"
                            name="FirstName"
                            onchange={changeHandler}>
                        </lightning-input>

                        <lightning-input 
                            type="text"
                            label="Last Name"
                            name="LastName"
                            onchange={changeHandler}>
                        </lightning-input>

                        <lightning-input 
                            type="email"
                            label="Email"
                            name="Email"
                            onchange={changeHandler}>
                        </lightning-input>

                    </div>

                    <div class="slds-col">

                        <lightning-input 
                            type="tel"
                            label="Phone"
                            name="Phone"
                            onchange={changeHandler}>
                        </lightning-input>

                        <lightning-input 
                            type="text"
                            label="Title"
                            name="Title"
                            onchange={changeHandler}>
                        </lightning-input>

                        <lightning-input 
                            type="text"
                            label="Department"
                            name="Department"
                            onchange={changeHandler}>
                        </lightning-input>

                    </div>

                </div>

                <div class="slds-align_absolute-center" >
                    <div class=" slds-var-m-top_x-small ">
                        <lightning-button class="slds-var-m-right_x-small" 
                            label="Cancel"
                            variant="neutral"
                            type="reset">
                        </lightning-button>
                        <lightning-button  
                            label="Create Contact"
                            variant="brand"
                            onclick={createContact}
                        >
                        </lightning-button>
                    </div>
                </div>

            </form>

        </div>
    </lightning-card>    
</template>
