<template>
    <lightning-card title="LIGHTNING RECORD EDIT VIEW FORM - CASE" icon-name="standard:case">
        
            <div class="slds-var-m-around_medium">
                <lightning-record-edit-form
                    record-id={recordId}
                    object-api-name={objectName}
                    onsuccess={successHandler}>
                    <lightning-messages></lightning-messages>
                    <div class="slds-grid slds-gutters">
                        <div class="slds-col">
                            <lightning-input-field field-name={fieldsE.subject}></lightning-input-field>
                            <lightning-input-field field-name={fieldsE.priority}></lightning-input-field>
                            <lightning-input-field field-name={fieldsE.status}></lightning-input-field>
                            <lightning-input-field field-name={fieldsE.description}></lightning-input-field>
                            <lightning-input-field field-name={fieldsE.origin}></lightning-input-field>

                        </div> 
                        <div class="slds-col">
                            <lightning-output-field field-name={fieldsE.accName}></lightning-output-field>
                            <lightning-output-field field-name={fieldsE.contName}></lightning-output-field>
                            
                        </div> 
                    </div> 
                                        
                    <div class="slds-align_absolute-center" >
                        <lightning-button class="slds-var-m-right_x-small"
                            label="Cancel"
                            variant="neutral"
                            type="reset">
                        </lightning-button>
                        <lightning-button 
                            label="Save"
                            variant="brand"
                            type="submit">
                        </lightning-button>
                    </div>

                </lightning-record-edit-form>
            </div>

        
    </lightning-card>
    
</template>
